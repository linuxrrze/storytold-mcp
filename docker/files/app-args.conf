# Extra `<app>-cli mcp` arguments, one app per line: <app> <args...>
# $WORK_DIR / $HOME are expanded when the server config is rendered (at
# container start). Apps not listed run plain `<app>-cli mcp`, which is
# headless for every app except vectorcraft: it bridges to a running app by
# default, and only its automation-root flags (which imply --headless) keep
# it in-process -- don't drop them there.
#
# The automation roots confine every file a server reads/writes to the
# shared work dir. Flags were taken from the 2026-10 builds' usage text;
# the build's detect step fails if an app starts rejecting them.
#
# No root flags in their MCP mode (not confined): cadcraft, filmcraft,
# gridcraft, lightcraft.
deckcraft    --automation-read-root $WORK_DIR --automation-write-root $WORK_DIR
designcraft  --automation-read-root $WORK_DIR --automation-write-root $WORK_DIR
effectcraft  --autosave --automation-read-root $WORK_DIR --automation-write-root $WORK_DIR
figcraft     --automation-read-root $WORK_DIR --automation-write-root $WORK_DIR
pdfcraft     --root $WORK_DIR
photocraft   --automation-read-root $WORK_DIR --automation-write-root $WORK_DIR
soundcraft   --automation-read-root $WORK_DIR --automation-write-root $WORK_DIR
# texturecraft has its own flag names, and without them no file access at all.
texturecraft --read-root $WORK_DIR --write-root $WORK_DIR
vectorcraft  --automation-read-root $WORK_DIR --automation-write-root $WORK_DIR
wordcraft    --automation-read-root $WORK_DIR --automation-write-root $WORK_DIR
